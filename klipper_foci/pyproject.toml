[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "klipper-foci"
dynamic = ["version"]
description = "FOCI Klipper host extras: commissioning, autotune, core tuning"
requires-python = ">=3.11"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."

[project.optional-dependencies]
diagnostics = ["klipper-foci-diagnostics"]

[tool.hatch.build.targets.wheel]
packages = ["klipper_foci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E4", "E7", "E9", "E501",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PLR",
]
ignore = [
    "SIM108",
    "SIM116",
    "RUF005", "RUF006", "RUF021", "RUF036", "RUF037", "RUF043",
    "RUF060", "RUF061", "RUF064", "RUF102", "RUF103", "RUF104",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1714",
    "PLR2004", "PLR5501",
]

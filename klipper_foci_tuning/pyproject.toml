[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klipper-foci-tuning"
version = "0.1.0"
description = "FOCI rare fine-tuning setters (bringup/debug only)"
requires-python = ">=3.11"
dependencies = ["klipper-foci"]

[project.entry-points."klipper_foci.commands"]
tuning = "klipper_foci_tuning.registry:register"

[tool.hatch.build.targets.wheel]
packages = ["klipper_foci_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule selection replacing ruff's 415-rule no-config fallback.
select = [
    "F",           # pyflakes
    "E4", "E7", "E9", "E501",  # pycodestyle: import/statement/syntax errors, line length
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "RUF",         # Ruff-specific rules
    "PLR",         # Pylint refactor
]
ignore = [
    "SIM108",  # if-else-block-instead-of-if-exp: ternary rewrite hurts readability
    "SIM116",  # if-else-block-instead-of-dict-lookup: trades a branch for indirection
    # RUF codes excluded from ruff's own default rule set; not adopted
    "RUF005", "RUF006", "RUF021", "RUF036", "RUF037", "RUF043",
    "RUF060", "RUF061", "RUF064", "RUF102", "RUF103", "RUF104",
    # PLR complexity/magic-value thresholds excluded from ruff's default; would
    # add ~1,600 findings across the three packages for a judgment-call rule
    # family, not a true/false-positive one
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1714",
    "PLR2004", "PLR5501",
]

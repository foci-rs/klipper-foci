[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Rule-selection decision recorded in FOC-225: explicit selection replacing
# ruff's 415-rule no-config fallback. See the issue for per-prefix rationale.
select = [
    "F",           # pyflakes
    "E4", "E7", "E9", "E501",  # pycodestyle: import/statement/syntax errors, line length
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "RUF",         # Ruff-specific rules
    "PLR",         # Pylint refactor
]
ignore = [
    "SIM108",  # if-else-block-instead-of-if-exp: ternary rewrite hurts readability
    "SIM116",  # if-else-block-instead-of-dict-lookup: trades a branch for indirection
    # RUF codes excluded from ruff's own default rule set; not adopted (see FOC-225)
    "RUF005", "RUF006", "RUF021", "RUF036", "RUF037", "RUF043",
    "RUF060", "RUF061", "RUF064", "RUF102", "RUF103", "RUF104",
    # PLR complexity/magic-value thresholds excluded from ruff's default; would
    # add ~1,600 findings across the three packages for a judgment-call rule
    # family, not a true/false-positive one (see FOC-225)
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1714",
    "PLR2004", "PLR5501",
]

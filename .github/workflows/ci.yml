name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        package: [klipper_foci, klipper_foci_diagnostics]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ruff + pytest
        run: pip install ruff pytest
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  wheel-contents:
    name: Wheel contents (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build + pytest + ruff
        run: pip install build pytest ruff
      - name: ruff check (repo-level tests and deploy shims)
        run: ruff check tests deploy
      - name: ruff format --check (repo-level tests and deploy shims)
        run: ruff format --check tests deploy
      - name: pytest tests/
        run: pytest -q tests/

  installer-shell-tests:
    name: installer.sh bats suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run installer_tests/
        run: bats installer_tests/
